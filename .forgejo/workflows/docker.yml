# Builds the image and pushes it to the Forgejo registry.
# Auth: the automatic GITHUB_TOKEN only gets package *read* on this instance, so
# pushes 401 on blob upload. Log in with a write:package PAT stored as the
# REGISTRY_TOKEN repo secret instead (see the forgejo README).
name: docker

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: git.gjessing.io/gjessing1/guessing

jobs:
  # Build, push and deploy in ONE job. A separate `needs:` deploy job would have to
  # queue for a second turn on this instance's single capacity-1 runner (shared by
  # every repo, and often held by atlas's 30-50 minute builds). If a new commit lands
  # during that wait, Forgejo auto-cancels the previous run's still-queued job and the
  # deploy is silently skipped, leaving a stale container behind a green run.
  build-and-deploy:
    runs-on: docker
    permissions:
      contents: read
      packages: write # not sufficient alone on this instance; push uses REGISTRY_TOKEN
    env:
      # Deploy project (compose file + .env), bind-mounted into the job by the runner.
      DEPLOY_DIR: /home/gjessing/docker/productivity/guessing
    steps:
      - uses: actions/checkout@v4

      - name: Log in to the Forgejo registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.gjessing.io -u gjessing1 --password-stdin

      - name: Build and push
        run: |
          SHA_TAG="${GITHUB_SHA::7}"
          docker build -t "$IMAGE:latest" -t "$IMAGE:$SHA_TAG" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:$SHA_TAG"

      # Redeploy on the host, against the host daemon via the mounted Docker socket.
      # Pulls git.gjessing.io/...:latest — the image just pushed above. No separate
      # registry auth needed: the `docker login` above already covers git.gjessing.io,
      # which is where this repo pushes to as well. Guarded on main because
      # workflow_dispatch can fire from any branch.
      - name: Pull and restart
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$DEPLOY_DIR"
          docker compose pull
          docker compose up -d --remove-orphans

      # Fail loudly if the stack came back on the old image, so a lost deploy shows up
      # as a red run instead of a green one with a stale container.
      - name: Verify deploy
        if: github.ref == 'refs/heads/main'
        run: |
          cd "$DEPLOY_DIR"
          built=$(docker image inspect --format '{{.Id}}' "$IMAGE:latest")
          running=$(docker compose ps -q | xargs -r docker inspect --format '{{.Image}}')
          if ! printf '%s\n' "$running" | grep -qFx "$built"; then
            echo "no running container uses the image just built ($built)" >&2
            docker compose ps >&2
            exit 1
          fi
          echo "deployed $built"
